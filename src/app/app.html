
 <mat-toolbar class="mamara-header">
  <div class="header-logo">
    <img src="https://pngsource.in/assets/thumbnails/Marmara-Universitesi-Logo-Pngsource-ARN94PK1.png" alt="" class="logo-icon">
    <span class="logo-text">MaMaRa</span>
  </div>

  <span class="example-spacer"></span>

  <div class="header-right">
    
    <button mat-icon-button class="notification-button">
      <mat-icon class="icon-notification">notifications</mat-icon>
      <span class="badge-red">!</span> 
    </button>
    
    <div class="language-selector">
      <mat-icon class="icon-globe">language</mat-icon>
      <span class="language-text">EN</span>
      <mat-icon class="dropdown-arrow">arrow_drop_down</mat-icon>
    </div>

    <div class="user-profile">
      <mat-icon class="icon-user">account_circle</mat-icon>
      <span class="user-name-text">UserName</span>
      <mat-icon class="dropdown-arrow">arrow_drop_down</mat-icon>
    </div>
    
    <div class="schaeffler-logo">
      SCHAEFFLER
    </div>

  </div>
</mat-toolbar>
 <app-image-detection-ai></app-image-detection-ai>
